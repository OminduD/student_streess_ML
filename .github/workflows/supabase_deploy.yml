name: Supabase Database Migration CI/CD

on:
  push:
    branches: [ main, master ]
    paths:
      - 'supabase/**'
  workflow_dispatch:

jobs:
  deploy_database:
    name: Apply Database Migrations to Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check Supabase Credentials
        id: check_creds
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "✅ Supabase credentials detected for migration"
          else
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "ℹ️ SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_ID not set. Skipping automated CLI migration."
          fi

      - name: Link Project and Push Migrations
        if: steps.check_creds.outputs.has_creds == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }} --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
          echo "✅ Migrations pushed successfully to Supabase project ${{ secrets.SUPABASE_PROJECT_ID }}"
